name: Sync to Hugging Face hub

on:
  push:
    branches: [master]

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push Subfolder to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure Git LFS is available
          git lfs install

          # Split the subfolder into its own branch
          SPLIT_SHA=$(git subtree split --prefix human-resource-data-analysis-streamlit)
          git branch hf-deploy $SPLIT_SHA
          git checkout hf-deploy

          # Convert binary files to Git LFS on this branch (rewrites history for this disposable branch only)
          git lfs migrate import --include="*.png,*.jpg,*.jpeg,*.pkl" --everything

          # Push to Hugging Face
          git push --force https://Yashraj64004:$HF_TOKEN@huggingface.co/spaces/Yashraj64004/human-resource-data-analysis-streamlit hf-deploy:main